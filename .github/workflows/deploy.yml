name: Continuous Integration & Deployment (Prod)

on:
  push:
    branches:
      - main  # Triggers the pipeline automatically when code hits your main branch

jobs:
  build-and-ship:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the raw source code into the GitHub runner
    - name: Checkout Code Execution Context
      uses: actions/checkout@v4

    # 2. Set up automated caching for Docker build layers
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Securely authenticate the runner against your private Azure Registry
    - name: Authenticate Private Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: presentregistry7007.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 4. Build the lean multi-stage production image and push it to Singapore
    - name: Compile and Push Production Container
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: presentregistry7007.azurecr.io/present-app:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 5. Hot-swap the container live on your Azure Linux App Engine
    - name: Deploy Container Updates to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'present-attendance-app'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: 'presentregistry7007.azurecr.io/present-app:latest'